[package]
name = "jukebox"
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "jukebox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
# rustls instead of the default OpenSSL: OpenSSL isn't available when cross-compiling for Android
rustypipe = { version = "0.11", default-features = false, features = ["rustls-tls-webpki-roots"] }
rustypipe-downloader = { version = "0.3", default-features = false, features = ["rustls-tls-webpki-roots"] }

# rquickjs (used by rustypipe) ships no prebuilt Android bindings, so generate them
[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.9", features = ["bindgen"] }
